function fitCanvas(){
  const els = $$('.cnode');
  if (!els.length) return;
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  els.forEach(el => {
    const n = S.canvas.nodes.find(x => x.id === el.dataset.node);
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + el.offsetWidth); maxY = Math.max(maxY, n.y + el.offsetHeight);
  });
  const w = maxX - minX, h = maxY - minY;
  const vw = innerWidth, vh = innerHeight;
  const z = Math.min(1, Math.min((vw - 260) / w, (vh - 200) / h));
  S.canvas.zoom = Math.max(0.35, z);
  S.canvas.x = (vw - w * S.canvas.zoom) / 2 - minX * S.canvas.zoom;
  S.canvas.y = (vh - h * S.canvas.zoom) / 2 - minY * S.canvas.zoom + 8;
  renderCanvas();
}

function selectOnly(id){

  dragSel = {

function startMarquee(e){
  pauseAllVideos();
  if (!e.shiftKey) clearSel();
  const wx = (e.clientX - S.canvas.x) / S.canvas.zoom;
  const wy = (e.clientY - S.canvas.y) / S.canvas.zoom;
  marquee = {x0: wx, y0: wy, x1: wx, y1: wy};
  let box = $('#marquee');
  if (!box){ box = document.createElement('div'); box.id = 'marquee'; box.className = 'marquee'; $('#cv-world').appendChild(box); }
  box.style.display = 'block';
  box.style.left = wx + 'px'; box.style.top = wy + 'px'; box.style.width = '0px'; box.style.height = '0px';
}

  if (spaceDown || e.button === 1){
    cvPan = {sx:e.clientX, sy:e.clientY, ox:S.canvas.x, oy:S.canvas.y};

    $('#cv-world').style.transform = `translate(${S.canvas.x}px,${S.canvas.y}px) scale(${S.canvas.zoom})`;

      box.style.left = Math.min(marquee.x0, wx) + 'px';
      box.style.top = Math.min(marquee.y0, wy) + 'px';
      box.style.width = Math.abs(wx - marquee.x0) + 'px';
      box.style.height = Math.abs(wy - marquee.y0) + 'px';
    }
    return;
  }
  if (S.canvas.linking){
    const A = CV.node(S.canvas.linking.from);
    if (A){
      S.canvas.linking.to = {
        x: (e.clientX - S.canvas.x) / S.canvas.zoom,
        y: (e.clientY - S.canvas.y) / S.canvas.zoom,
      };
      drawLinks();
    }
    return;
  }
  if (!dragSel) return;
  const dx = (e.clientX - dragSel.sx) / S.canvas.zoom;
  const dy = (e.clientY - dragSel.sy) / S.canvas.zoom;
  if (Math.abs(dx) + Math.abs(dy) > 2){
    if (!dragSel.moved){ cvPushHistory(); dragSel.moved = true; S.canvas.clickMoved = true; }
  }
  dragSel.items.forEach(it => {
    it.n.x = it.ox + dx; it.n.y = it.oy + dy;
    const el = $(`[data-node="${it.n.id}"]`);
    if (el){ el.style.left = it.n.x + 'px'; el.style.top = it.n.y + 'px'; }
  });
  drawLinks();
});

function nodeAction(act, id){
  const n = CV.node(id);
  if (act === 'preview') return openPreview(n);
  if (act === 'anchor'){
    S.canvas.anchors = S.canvas.anchors || [];
    S.canvas.anchors.push({id, name: n.title});
    return toast('已创建锚点');
  }
  if (act === 'chat') return openChat(n);
  if (act === 'send') return nodeAction('save', id);
  if (act === 'dup'){
    cvPushHistory();
    const c = JSON.parse(JSON.stringify(n));
    c.id = 'n' + Date.now(); c.x += 28; c.y += 28; c.title = n.title + ' 副本';
    S.canvas.nodes.push(c); S.canvas.sel = [c.id];
    renderCanvas(); toast('已复制节点');
    return;
  }
  if (act === 'send'){
    const b = S.canvas.box;
    const start = b.clips.filter(c => c.track === 'v').reduce((m, c) => Math.max(m, c.start + c.len), 0);
    b.clips.push({id:'b' + Date.now(), track:'v', name: n.title.slice(0, 8), start, len:4});
    b.total = Math.max(b.total, start + 4.4);
    renderCanvas(); toast('已送入剪辑箱');
    return;
  }
  if (act === 'save'){
    const name = n.title.slice(0, 10) + '.png';
    S.canvas.assets.push({name, kind: n.type === 'video' ? '视频' : '图片', dur: '—', t: n.t || 't2'});
    S.lib.assets.push({id:'m' + Date.now(), name, dur:'—', t: n.t || 't2'});
    $('#drawer').classList.add('open');
    renderCanvas(); toast('已存入素材库');
    return;
  }
  if (act === 'del'){
    cvPushHistory();
    S.canvas.nodes = S.canvas.nodes.filter(x => x.id !== id);
    S.canvas.links = S.canvas.links.filter(([a, b]) => a !== id && b !== id);
    S.canvas.sel = S.canvas.sel.filter(x => x !== id);
    renderCanvas(); toast('已删除节点');
  }
}

function canvasAction(act){
  if (act === 'fit') return fitCanvas();
  if (act === 'undo') return cvUndo();
  if (act === 'select-all'){ S.canvas.sel = S.canvas.nodes.map(n => n.id); renderCanvas(); return; }
  if (act === 'export'){
    const data = JSON.stringify({nodes:S.canvas.nodes, links:S.canvas.links}, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = 'canvas.json'; a.click();
    return toast('已导出 canvas.json');
  }
  if (act.startsWith('new-')){
    addNode(act.replace('new-', ''));
  }
}

function fmtT(t){ t = Math.max(0, t||0); const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); }
function syncVideoUI(cn){
  const v = cn?.querySelector('.cv-video'); if (!v) return;
  const bar = cn.querySelector('.vbar'); if (!bar) return;
  const fill = bar.querySelector('.vtrack i');
  const tt = bar.querySelector('[data-vtime]');
  const dur = bar.querySelector('[data-vdur]');
  const p = (v.duration || 0) ? (v.currentTime / v.duration) : 0;
  if (fill) fill.style.width = (p * 100).toFixed(1) + '%';
  if (tt) tt.textContent = fmtT(v.currentTime);
  if (dur && v.duration) dur.textContent = fmtT(v.duration);
}
function bindVideos(){
  $$('.cnode').forEach(cn => {
    const v = cn.querySelector('.cv-video'); if (!v || v.dataset.bound) return;
    v.dataset.bound = '1';
    v.addEventListener('timeupdate', () => syncVideoUI(cn));
    v.addEventListener('loadedmetadata', () => syncVideoUI(cn));
    v.addEventListener('ended', () => { cn.classList.remove('playing'); });
    syncVideoUI(cn);
  });
}
function pauseAllVideos(){
  $$('.cnode').forEach(cn => {
    const v = cn.querySelector('.cv-video'); if (!v) return;
    if (!v.paused) v.pause();
    cn.classList.remove('playing');
  });
}

function toggleVideo(v){
  if (!v) return;
  const cn = v.closest('.cnode');
  if (v.paused){ v.play().catch(()=>{}); cn?.classList.add('playing'); }
  else { v.pause(); cn?.classList.remove('playing'); }
}
$('#cv-nodes').addEventListener('click', e => {

  if (e.target.closest('[data-vtoggle]')){ e.stopPropagation(); toggleVideo(v); return; }
  if (e.target.closest('[data-vtrack]')){
    e.stopPropagation();
    const r = e.target.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (v.duration) { v.currentTime = p * v.duration; syncVideoUI(cn); }
    return;

  }
  if (clip){

    renderCanvas(); return;
  }
  if (!cvDragClip) return;
  const b = S.canvas.box, wpx = $('#mtl')?.getBoundingClientRect().width || 300;
  cvDragClip.c.start = Math.max(0, Math.min(b.total - cvDragClip.c.len, cvDragClip.start0 + (e.clientX - cvDragClip.sx) / wpx * b.total));
  renderCanvas();
});
window.addEventListener('pointerup', () => {
  if (cvDragClip){
    const b = S.canvas.box, c = cvDragClip.c;
    const same = b.clips.filter(x => x.track === c.track).sort((a, b2) => a.start - b2.start);
    const idx = same.findIndex(x => x.id === c.id);
    const center = c.start + c.len / 2;
    let target = same.findIndex(x => center < x.start + x.len / 2);
    if (target < 0) target = same.length - 1;
    if (target !== idx){ same.splice(idx, 1); same.splice(target, 0, c); let t = 0; same.forEach(x => { x.start = t; t += x.len; }); }
    renderCanvas();
  }
  cvDragClip = null; cvTrimClip = null;
});

$('#screen-canvas').addEventListener('wheel', e => {
  e.preventDefault();
  if (e.metaKey || e.ctrlKey){
    const old = S.canvas.zoom;
    const next = Math.min(2, Math.max(0.2, old * (e.deltaY > 0 ? 0.92 : 1.08)));
    S.canvas.x = e.clientX - (e.clientX - S.canvas.x) * (next / old);
    S.canvas.y = e.clientY - (e.clientY - S.canvas.y) * (next / old);
    S.canvas.zoom = next;
  } else { S.canvas.x -= e.deltaX; S.canvas.y -= e.deltaY; }
  renderCanvas();
}, { passive:false });

$$('[data-zoom]').forEach(b => b.addEventListener('click', () => {

  S.canvas.y = innerHeight / 2 - (innerHeight / 2 - S.canvas.y) * (next / old);

}));

});

/* 快捷键 */
document.addEventListener('keydown', e => {
  if (S.screen !== 'canvas') return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'Space'){ spaceDown = true; e.preventDefault(); return; }
  if (e.key === 'Escape'){ closeCtx(); clearSel(); S.canvas.linking = null; renderCanvas(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (S.canvas.sel.length){
      cvPushHistory();
      const ids = [...S.canvas.sel];
      S.canvas.nodes = S.canvas.nodes.filter(n => !ids.includes(n.id));
      S.canvas.links = S.canvas.links.filter(([a, b]) => !ids.includes(a) && !ids.includes(b));
      S.canvas.sel = []; renderCanvas(); toast(`已删除 ${ids.length} 个节点`);
      e.preventDefault();
    } else if (S.canvas.linkSel){
      cvPushHistory();
      const [a, b] = S.canvas.linkSel.split('|');
      S.canvas.links = S.canvas.links.filter(([x, y]) => !(x === a && y === b));
      S.canvas.linkSel = null; renderCanvas(); toast('已删除连线');
      e.preventDefault();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd' && S.canvas.sel.length){
    cvPushHistory();
    S.canvas.sel.slice().forEach(id => nodeAction('dup', id));
    e.preventDefault();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ cvUndo(); e.preventDefault(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

/* 小地图 */
let mmOpen = false;
function renderMinimap(){
  const mm = $('#minimap'); if (!mm || !mm.classList.contains('on')) return;
  const body = $('#mm-body'); if (!body) return;
  const ns = S.canvas.nodes;
  if (!ns.length){ body.innerHTML = ''; return; }
  const pad = 8, W = 180, H = 120;
  const minX = Math.min(...ns.map(n => n.x)), maxX = Math.max(...ns.map(n => n.x + n.w));
  const minY = Math.min(...ns.map(n => n.y)), maxY = Math.max(...ns.map(n => n.y + n.w * 1.33));
  const sx = (W - pad * 2) / Math.max(1, maxX - minX), sy = (H - pad * 2) / Math.max(1, maxY - minY);
  const k = Math.min(sx, sy);
  const ox = pad - minX * k, oy = pad - minY * k;
  let html = ns.map(n => {
    const sel = (S.canvas.sel || []).includes(n.id) ? ' on' : '';
    return `<div class="mnode${sel}" style="left:${(n.x*k+ox).toFixed(1)}px;top:${(n.y*k+oy).toFixed(1)}px;width:${Math.max(3,n.w*k).toFixed(1)}px;height:${Math.max(3,n.w*1.33*k).toFixed(1)}px"></div>`;
  }).join('');
  // 视口矩形
  const vx = (-S.canvas.x / S.canvas.zoom), vy = (-S.canvas.y / S.canvas.zoom);
  const vw = innerWidth / S.canvas.zoom, vh = innerHeight / S.canvas.zoom;
  html += `<div class="mview" style="left:${(vx*k+ox).toFixed(1)}px;top:${(vy*k+oy).toFixed(1)}px;width:${(vw*k).toFixed(1)}px;height:${(vh*k).toFixed(1)}px"></div>`;
  body.innerHTML = html;
  body.dataset.k = k; body.dataset.ox = ox; body.dataset.oy = oy;
}
$('#btn-locate')?.addEventListener('click', () => {
  mmOpen = !mmOpen;
  $('#minimap').classList.toggle('on', mmOpen);
  if (mmOpen) renderMinimap();
});
$('#minimap')?.addEventListener('pointerdown', e => {
  const body = $('#mm-body'); if (!body) return;
  const r = body.getBoundingClientRect();
  const k = Number(body.dataset.k) || 0.2, ox = Number(body.dataset.ox) || 0, oy = Number(body.dataset.oy) || 0;
  const wx = (e.clientX - r.left - ox) / k, wy = (e.clientY - r.top - oy) / k;
  S.canvas.x = innerWidth / 2 - wx * S.canvas.zoom;
  S.canvas.y = innerHeight / 2 - wy * S.canvas.zoom;
  renderCanvas();
});

      } },
    { kind:'sub', label:'新建幕布', icon:svgIco('plus'), onPick: () => {
        const c = {id:'cv'+Date.now(), name:'新幕布 ' + (S.canvases.length + 1), draftId:null};
        S.canvases.push(c);
        go('canvas'); setTimeout(() => { S.canvas.nodes = []; S.canvas.links = []; renderCanvas(); toast('已新建空幕布'); }, 60);
      } },
  ]);
}

/* ===== 画布 → 剪辑台 ===== */
function parseDur(str, fallback){
  if (!str) return fallback;
  const m = /^(\d+):(\d{2})$/.exec(str.trim());
  if (!m) return fallback;
  return Number(m[1]) * 60 + Number(m[2]);
}
function upstreamOrder(finalId){
  const links = S.canvas.links || [];
  const order = [], seen = new Set();
  const visit = (id) => {
    if (seen.has(id)) return;
    seen.add(id);
    links.filter(([, b]) => b === id).forEach(([a]) => visit(a));
    order.push(id);
  };
  visit(finalId);
  return order;
}
function openEditorFromCanvas(finalId){
  const nodes = S.canvas.nodes;
  const order = upstreamOrder(finalId).filter(id => id !== finalId);
  const picked = order.map(id => CV.node(id)).filter(Boolean);
  const clips = [];
  let vStart = 0, i = 0;
  picked.forEach(n => {
    if (n.type === 'script'){
      const len = 4;
      clips.push({id:'cv'+i++, track:'text', name:(n.title || '文本'), text:(n.text || '').replace(/\n/g, ' '), start:0.4, len, baseDur:len, speed:1, font:'思源黑体', size:44, color:'#ffffff', stroke:true});
    } else if (n.type === 'video' || n.type === 'image'){
      const len = parseDur(n.dur, n.type === 'video' ? 5 : 3);
      clips.push({id:'cv'+i++, track:'video', kind: n.type === 'image' ? 'image' : undefined, name:n.title || '片段', start:vStart, len, baseDur:len, speed:1, volume:80, muted:false, src:n.src || ''});
      vStart += len;
    } else if (n.type === 'audio'){
      const len = parseDur(n.dur, 4);
      clips.push({id:'cv'+i++, track:'audio', name:n.title || '音频', start:0, len, baseDur:len, speed:1, volume:80, muted:false});
    }
  });
  if (!clips.length) return toast('这条成片还没有上游片段');
  S.clips = clips;
  S.fromCanvas = {finalId, name:(CV.node(finalId) || {}).title || '成片预览'};
  go('editor');
  toast('已带入 ' + clips.length + ' 个片段');
}

/* 素材库抽屉 */
$('#drawer-close')?.addEventListener('click', () => $('#drawer').classList.remove('open'));
$('#drawer-save')?.addEventListener('click', saveBoxToAssets);
$('#drawer-to-editor')?.addEventListener('click', () => { $('#drawer').classList.remove('open'); go('editor'); });

function saveBoxToAssets(){
  const b = S.canvas.box;
  if (!b.clips.length) return toast('剪辑箱是空的');
  const name = '粗剪_' + (S.canvas.assets.length + 1) + '.mp4';
  const dur = tc(Math.max(...b.clips.map(c => c.start + c.len)));
  S.canvas.assets.push({name, kind:'视频', dur, t:'t2'});
  S.lib.assets.push({id:'m' + Date.now(), name, dur, t:'t2'});
  S.lib.cloud.push({id:'mc' + Date.now(), name, dur, t:'t2'});
  $('#drawer').classList.add('open');
  renderCanvas(); toast('已存入素材库');
}

function bmHelp(){modal({title:'双幕 · 从创作到成片',width:710,body:`<div class="bm-help-list"><p><strong>幕布生成素材，剪辑器编排成片。</strong><br>在幕布构思、引用和生成素材，切换到剪辑器完成排序、裁切与精剪。</p><p><strong>1　幕布 → 剪辑器</strong><br>选中素材后点击“加入时间线”，再通过顶部“剪辑器”或成片节点的“进入剪辑器”编排。成片节点展示剪辑器中的成片结果。</p><p><strong>2　剪辑器 → 幕布 → 返回剪辑</strong><br>选中片段，点击“为选中片段生成”，定位素材来源。生成新版本后返回，对比确认替换；原有位置、裁切、变速与音量保留。</p><p><strong>3　需要补镜头</strong><br>在“AI 生成”中选择“在播放头位置补镜头”。完成生成后点击顶部的“插入并返回剪辑”，主轨在原位置插入新画面。</p><p><strong>版本与引用</strong><br>生成引用不会自动成为成片片段；新结果不会自动覆盖已用版本。每个片段可追溯到源节点和素材版本，删除源节点也会保留已使用的快照。</p></div><div class="bm-shortcut-grid">${[['新建节点','Tab'],['多选','Shift + 点击'],['复制 / 粘贴','⌘ C / ⌘ V'],['撤销 / 重做','⌘ Z / ⌘ ⇧ Z'],['成组 / 解组','⌘ G / ⌘ ⇧ G'],['适应画布','⌘ 0'],['生成','⌘ Enter'],['平移 / 缩放','空格拖动 / ⌘ 滚轮']].map(([a,b])=>`<div><span>${a}</span><kbd>${b}</kbd></div>`).join('')}</div><div class="bm-notice">本文件为离线交互原型：AI、飞书解析和智能处理使用 mock。项目保存于当前浏览器，也可下载 JSON。视频导出使用浏览器本地 WebM；样例照片已内嵌，来自 Unsplash。</div>`,footer:'<button class="btn primary" data-close>开始创作</button>'})}

function v6LibraryFingerprint(kind,snapshot,text=''){return JSON.stringify([kind,snapshot.src||'',snapshot.poster||'',snapshot.mime||'',snapshot.duration||0,snapshot.filter||'',kind==='script'?text:''])}
function v6UpgradeSharedLibrary(){
  if(!BM.boards||!Array.isArray(BM.materials)||BM.sharedLibraryVersion===1)return;
  const assets=[...(BM.assets||[])];
  for(const item of S.lib.assets||[]){if(!assets.some(a=>a.id===item.id))assets.push({...item,type:item.kind||(/\.(mp3|wav)$/i.test(item.name)?'audio':/\.(mp4|mov|webm)$/i.test(item.name)?'video':'image'),versions:[{...item.source,id:item.sourceVersion||1}],currentVersion:item.sourceVersion||1})}
  const nodes=BM.boards.flatMap(b=>b.canvas.nodes);
  for(const asset of assets){
    const kind=asset.type;if(!v6Kinds[kind])continue;
    const version=asset.currentVersion||1,snapshot=asset.versions?.find(v=>v.id===version)||asset.versions?.[0]||{id:version,poster:asset.poster,src:asset.src||'',mime:asset.mime||'',duration:bmSecs(asset.dur,5)};
    const key=v6LibraryFingerprint(kind,snapshot,asset.text);
    let material=BM.materials.find(m=>m.kind===kind&&v6LibraryFingerprint(m.kind,m.snapshot,m.text)===key);
    if(!material){
      const source=nodes.find(n=>n.type===kind&&(n.versions||[]).some(v=>v6LibraryFingerprint(n.type,v,n.text)===key));
      material={id:'mat-legacy-'+asset.id,nodeId:source?.id||'legacy-'+asset.id,boardId:source?v6Owner(source.id)?.id:null,sourceName:source?'':'历史保存的素材',name:asset.name||asset.title||'已保存素材',kind,version,snapshot:bmClone(snapshot),text:asset.text||'',prompt:asset.prompt||snapshot.prompt||'',collectionIds:[],selected:true,primary:!source||!BM.materials.some(m=>m.nodeId===source.id&&m.primary),created:Date.now()};
      BM.materials.push(material);
    }
    material.selected=true;
    material.legacyAssetIds=[...new Set([...(material.legacyAssetIds||[]),asset.id])];
    material.aliases=[...new Set([...(material.aliases||[]),asset.name||asset.title].filter(Boolean))];
  }
  BM.legacyAssets=[...(BM.legacyAssets||[]),...assets.filter(a=>!(BM.legacyAssets||[]).some(old=>old.id===a.id))];
  BM.assets=[];S.lib.assets=[];BM.sharedLibraryVersion=1;BM.workspaceName=BM.workspaceName||'我的工作空间';
}

function wpPresetRows(){return wpLibrary.tab==='official'?WP_PRESETS.filter(p=>p.types.includes(wpLibrary.node.type)):(BM.userPresets||[]).filter(p=>p.type===wpLibrary.node.type)}
function wpPresetGrid(){const state=wpLibrary,rows=wpPresetRows().filter(p=>(state.category==='全部'||p.category===state.category)&&(!state.query||[p.name,p.description,p.instruction].join(' ').toLowerCase().includes(state.query.toLowerCase())));return rows.map(p=>`<article class="wp-preset-card ${state.node.params.preset===p.name?'selected':''}"><div class="wp-preset-cover ${state.node.type==='script'?'wp-script-cover':''} ${p.collage?'is-collage':''}">${state.node.type==='script'?`<div>${bmIcon('script')}<strong>${esc(p.name)}</strong><span>${esc(p.instruction)}</span></div>`:p.collage?`<img src="${BM_ASSETS.character}" alt="${esc(p.name)}示例"><img src="${BM_ASSETS.portrait}" alt=""><img src="${BM_ASSETS.character}" alt="">`:`<img src="${BM_ASSETS[p.cover]||BM_ASSETS.portrait}" alt="${esc(p.name)}示例">`}<span class="wp-official-label">${state.tab==='official'?'官方':'我的'}</span>${p.heat?`<span class="wp-preset-heat">${bmIcon('flame')}${p.heat}</span>`:''}</div><div class="wp-preset-card-body"><h3 title="${esc(p.name)}"><button data-wp-action="detail" data-id="${p.id}" aria-label="查看${esc(p.name)}详情">${esc(p.name)}</button></h3><p>${esc(p.description||p.instruction)}</p><div class="wp-preset-card-bottom"><span>${esc(p.category)}</span>${state.tab==='mine'?`<button data-wp-action="edit" data-id="${p.id}" aria-label="编辑${esc(p.name)}">${bmIcon('edit')}</button>`:''}<button class="wp-use-preset" data-wp-action="${state.node.params.preset===p.name?'detail':'use'}" data-id="${p.id}">${state.node.params.preset===p.name?'已使用 · 查看':'使用此预设'}</button></div></div></article>`).join('')||`<div class="wp-preset-empty">${bmIcon('bulb')}<h3>${state.query||state.category!=='全部'?'没有匹配的预设':state.tab==='mine'?'还没有个人预设':'暂无可用预设'}</h3><p>${state.query||state.category!=='全部'?'试试其他分类或搜索词。':'把常用的生成要求保存为预设，在同类节点中重复使用。'}</p>${state.tab==='mine'?'<button data-wp-action="new">＋ 新建预设</button>':''}</div>`}
function wpRenderLibrary(){const {el,node:n}=wpLibrary;el.innerHTML=`<section class="wp-library" role="dialog" aria-modal="true" aria-labelledby="wp-library-title"><header><h2 id="wp-library-title">预设库</h2><nav aria-label="预设来源">${[['official','官方预设'],['mine','我的预设']].map(([key,label])=>`<button data-wp-action="tab" data-id="${key}" aria-pressed="${wpLibrary.tab===key}">${label}</button>`).join('')}</nav><button class="wp-new-preset" data-wp-action="new">${bmIcon('plus')}新建预设</button><button class="wp-library-close" data-wp-action="close" aria-label="关闭预设库">${bmIcon('close')}</button></header><div class="wp-library-layout"><aside aria-label="预设分类">${WP_CATEGORIES.map(c=>`<button data-wp-action="category" data-id="${c}" aria-pressed="${wpLibrary.category===c}">${c}</button>`).join('')}</aside><main><label class="wp-preset-search">${bmIcon('search')}<input type="search" aria-label="搜索预设名称" placeholder="搜索预设名称" value="${esc(wpLibrary.query)}"></label><div class="wp-preset-context"><span>${bmNames[n.type]}预设</span>${n.params.preset&&n.params.preset!=='无预设'?`<span>当前：${esc(n.params.preset)} <button data-wp-action="clear">取消使用</button></span>`:''}</div><div class="wp-preset-grid">${wpPresetGrid()}</div></main></div></section>`;}
wbPresets=function(n){if(n.status==='run')return toast('请在生成完成后调整预设');wpCloseAdjust(false);wpCloseLibrary(false);const el=document.createElement('div');el.id='wb-preset-library';el.className='wp-library-mask';document.body.appendChild(el);wpLibrary={el,node:n,tab:'official',category:'全部',query:'',view:'library'};wpRenderLibrary();
 el.addEventListener('click',e=>{e.stopPropagation();if(e.target===el)return wpCloseLibrary();const b=e.target.closest('[data-wp-action]');if(!b)return;const {wpAction:action,id}=b.dataset;if(action==='close')return wpCloseLibrary();if(action==='tab'||action==='category'){wpLibrary[action]=id;if(action==='tab'){wpLibrary.category='全部';wpLibrary.query=''}wpRenderLibrary();$(`[data-wp-action="${action}"][data-id="${id}"]`,el)?.focus();return}if(action==='new'||action==='edit')return wpEditPreset(action==='edit'?(BM.userPresets||[]).find(p=>p.id===id):null);if(action==='back'){wpLibrary.view='library';wpRenderLibrary();$('.wp-new-preset',el)?.focus();return}if(action==='detail')return wpPreviewPreset(id);if(action==='use')return wpApplyPreset(id);if(action==='apply')return wpApplyPreset(id);if(action==='save')return wpSavePreset();if(action==='clear'){bmHistory('取消生成预设');Object.assign(n.params,{preset:'无预设',presetId:null,presetPrompt:''});renderComposer();bmSave();wpRenderLibrary();toast('已取消使用预设')}});
 el.addEventListener('input',e=>{if(!e.target.matches('.wp-preset-search input'))return;wpLibrary.query=e.target.value;$('.wp-preset-grid',el).innerHTML=wpPresetGrid()});$('.wp-library-close',el)?.focus();
};
function wpPreviewPreset(id){const preset=wpPresetRows().find(p=>p.id===id);if(!preset)return;wpLibrary.view='detail';$('.wp-library-layout',wpLibrary.el).innerHTML=`<div class="wp-preset-detail"><button class="wp-back-to-list" data-wp-action="back">${bmIcon('back')}返回预设库</button><span class="wp-detail-category">${esc(preset.category)} · ${wpLibrary.tab==='official'?'官方预设':'我的预设'}</span><h2>${esc(preset.name)}</h2><p>${esc(preset.description||'自定义生成预设')}</p><h3>预设内容</h3><div class="wp-preset-instruction">${esc(preset.instruction)}</div><p class="wp-apply-note">应用到当前${bmNames[wpLibrary.node.type]}节点，保留已填写的提示词与生成参数。</p><button class="wp-primary" data-wp-action="apply" data-id="${id}">使用此预设</button></div>`;$('.wp-back-to-list',wpLibrary.el)?.focus()}
function wpApplyPreset(id){const p=wpPresetRows().find(p=>p.id===id),n=wpLibrary.node;if(!p||n.status==='run')return;bmHistory('使用生成预设');Object.assign(n.params,{preset:p.name,presetId:p.id,presetPrompt:p.instruction});if(n.type==='script')n.params.mode=p.name==='分镜脚本'?'分镜脚本':'文本生成';wpCloseLibrary(false);renderComposer();bmSave();$('#composer [data-v6="composer-preset"]')?.focus();toast('已使用「'+p.name+'」')}
function wpEditPreset(preset){wpLibrary.view='edit';wpLibrary.editing=preset?.id||null;const n=wpLibrary.node;$('.wp-library-layout',wpLibrary.el).innerHTML=`<form class="wp-preset-form"><button type="button" class="wp-back-to-list" data-wp-action="back">${bmIcon('back')}返回预设库</button><h2>${preset?'编辑预设':'新建预设'}</h2><p>保存为${bmNames[n.type]}预设，可在其他${bmNames[n.type]}节点中复用。</p><label>预设名称<input id="wp-preset-name" maxlength="40" value="${esc(preset?.name||'')}" placeholder="例如：雨夜电影感" required></label><label>分类<select id="wp-preset-category">${bmOptions(WP_CATEGORIES.slice(1),preset?.category||'通用')}</select></label><label>预设内容<textarea id="wp-preset-content" maxlength="4000" placeholder="填写希望重复使用的风格、生成要求或创作规则" required>${esc(preset?.instruction||n.prompt||'')}</textarea></label><div class="wp-form-error" role="alert"></div><button type="button" class="wp-primary" data-wp-action="save">保存预设</button></form>`;$('.wp-preset-form',wpLibrary.el).addEventListener('submit',e=>{e.preventDefault();wpSavePreset()});$('#wp-preset-name',wpLibrary.el)?.focus()}
function wpSavePreset(){const {el,node:n}=wpLibrary,name=$('#wp-preset-name',el).value.trim(),instruction=$('#wp-preset-content',el).value.trim(),category=$('#wp-preset-category',el).value,error=$('.wp-form-error',el);if(!name||!instruction){error.textContent=!name?'请输入预设名称':'请输入预设内容';$(!name?'#wp-preset-name':'#wp-preset-content',el).focus();return}if((BM.userPresets||[]).some(p=>p.type===n.type&&p.name===name&&p.id!==wpLibrary.editing)){error.textContent='已有同名预设，请换一个名称';$('#wp-preset-name',el).focus();return}bmHistory('保存个人预设');BM.userPresets=BM.userPresets||[];let preset=BM.userPresets.find(p=>p.id===wpLibrary.editing);const values={name,instruction,category,type:n.type,description:instruction.slice(0,80),cover:n.poster||'portrait'};if(preset)Object.assign(preset,values);else BM.userPresets.push({id:'user-'+bmId(),...values});wpLibrary.view='library';wpLibrary.tab='mine';wpLibrary.category='全部';wpLibrary.query='';bmSave();wpRenderLibrary();toast('预设已保存到「我的预设」');$('.wp-new-preset',el)?.focus()}
const wpPreviousRender=renderComposer;
renderComposer=function(){if(wpAdjust)wpCloseAdjust(false);wpPreviousRender();const n=bmNode($('#composer')?.dataset.node);if(!n)return;const params=$('#composer [data-v6="composer-params"]');if(params){params.setAttribute('aria-haspopup','dialog');params.setAttribute('aria-expanded','false');params.innerHTML+=bmIcon('chevron');if(n.params.durationAuto){const span=$('span',params);if(span)span.textContent=(n.params.ratio==='智能'?'Auto':n.params.ratio)+' · '+n.params.resolution+' · 自适应'}}const preset=$('#composer [data-v6="composer-preset"]');if(preset){preset.setAttribute('aria-haspopup','dialog');preset.title=n.params.preset&&n.params.preset!=='无预设'?'当前预设：'+n.params.preset:'打开预设库';if(n.params.preset&&n.params.preset!=='无预设'){preset.classList.add('wp-preset-active');preset.innerHTML=bmIcon('bulb')+'<span>预设</span>'+bmIcon('check')}}};
// 捕获 Esc，避免旧画布快捷键同时清空节点选择。
window.addEventListener('keydown',e=>{const root=wpLibrary?.el||wpAdjust?.el;if(!root)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(wpLibrary)wpCloseLibrary();else wpCloseAdjust();return}wpTrap(e,root);if(e.key!=='Tab')e.stopPropagation()},true);
window.addEventListener('pointerdown',e=>{if(wpAdjust&&!wpAdjust.el.contains(e.target)&&!e.target.closest('#composer [data-v6="composer-params"]'))wpCloseAdjust(false)},true);
window.addEventListener('resize',()=>{wpPositionAdjust()});
window.addEventListener('scroll',()=>{if(wpAdjust)wpPositionAdjust()},true);

bmInit();

</script>
</body>
</html>
