<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>双幕 · 幕布与剪辑器 · v0.6</title>
<style>
/* ================= 基础 ================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e10; --bar:#161719; --panel:#191a1d; --panel2:#202227; --panel3:#262930;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#e9ebef; --muted:#8d939e; --dim:#5e646d;
  --blue:#3b7bfa; --blue2:#6ea0ff; --bluebg:rgba(59,123,250,.14);
  --ok:#3ecf8e; --warn:#f7b955; --danger:#ff5f66;
  --grad:linear-gradient(135deg,#7a6bff,#3b7bfa);
  --sh:0 18px 50px rgba(0,0,0,.55);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
::-webkit-scrollbar-track{background:transparent}
.screen{position:fixed;inset:0;display:none;background:var(--bg)}
.screen.active{display:flex}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.06);transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.11)}
.btn.primary{background:var(--blue);box-shadow:0 6px 18px rgba(59,123,250,.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--muted);font-size:11px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.icobtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.icobtn:hover{background:rgba(255,255,255,.09);color:var(--text)}

/* ================= 首页 ================= */
.side{width:208px;flex:0 0 208px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px 10px;background:#101113}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(90,110,255,.35)}
.brand b{font-size:15px;letter-spacing:1px}
.brand .tag{font-size:9px;color:#b9c6ff;background:rgba(59,123,250,.18);padding:1px 5px;border-radius:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:9px;height:37px;padding:0 10px;border-radius:7px;color:var(--muted);font-size:13px;text-align:left;transition:.15s}
.nav-item svg{width:16px;height:16px;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.055);color:var(--text)}
.nav-item.on{background:rgba(255,255,255,.08);color:var(--text);font-weight:500}
.nav-item .new{margin-left:auto;font-size:9px;color:#071018;background:linear-gradient(135deg,#8ef0c6,#4fc3ff);padding:1px 4px;border-radius:3px;font-weight:700}
.side-gap{flex:1}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--line)}
.user{display:flex;align-items:center;gap:9px;padding:8px;border-radius:7px;margin-top:4px}
.user:hover{background:rgba(255,255,255,.05)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f7b26a,#e2668b);display:grid;place-items:center;font-size:11px;font-weight:700;color:#231a12}
.user b{display:block;font-size:12px;font-weight:500}
.user span{font-size:10px;color:var(--dim)}

.home-main{flex:1;display:flex;flex-direction:column;min-width:0}
.home-top{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:500}
.top-right{display:flex;align-items:center;gap:8px}
.home-scroll{flex:1;overflow-y:auto;padding:20px 24px 60px}
.wrap{max-width:1160px;margin:0 auto}

.hero{position:relative;width:100%;height:180px;border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;transition:.22s;
  background:
   radial-gradient(90% 160% at 8% 0,rgba(122,107,255,.5),transparent 58%),
   radial-gradient(80% 150% at 90% 4%,rgba(59,123,250,.45),transparent 55%),
   radial-gradient(70% 120% at 58% 118%,rgba(255,105,180,.26),transparent 60%),
   linear-gradient(135deg,#1a2130,#0f1218 70%)}
.hero:hover{border-color:rgba(255,255,255,.18);transform:translateY(-1px)}
.hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.15) 1px,transparent 1px);background-size:26px 26px;opacity:.22;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.hero-cta{position:relative;z-index:2;display:flex;align-items:center;gap:11px;height:50px;padding:0 24px;border-radius:12px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);font-size:16px;font-weight:600;letter-spacing:.5px;transition:.2s}
.hero:hover .hero-cta{background:rgba(255,255,255,.16);transform:scale(1.02)}
.hero-cta .plus{width:24px;height:24px;border-radius:7px;background:#fff;color:#12141a;display:grid;place-items:center;font-size:16px;font-weight:700}
.hero-sub{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.42);z-index:2}

.hub{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;margin-bottom:22px;border:1px solid rgba(59,123,250,.26);width:100%;text-align:left;transition:.2s;
  background:linear-gradient(100deg,rgba(59,123,250,.14),rgba(122,107,255,.06) 45%,rgba(255,255,255,.02))}
.hub:hover{border-color:rgba(59,123,250,.5);background:linear-gradient(100deg,rgba(59,123,250,.2),rgba(122,107,255,.09) 45%,rgba(255,255,255,.03))}
.hub-orb{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 10px 24px rgba(59,123,250,.35)}
.hub-txt{flex:1;min-width:0}
.hub-txt h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.hub-txt h3 .mini{font-size:9px;font-weight:600;color:#c3d4ff;background:rgba(59,123,250,.2);padding:1px 5px;border-radius:3px}
.hub-txt p{font-size:11px;color:var(--muted);margin-top:3px}
.hub-preview{display:flex;align-items:center;gap:5px;margin-right:4px}
.hub-node{width:24px;height:32px;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:9px;color:var(--muted)}
.hub-go{display:flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:7px;background:#fff;color:#111;font-size:12px;font-weight:600;flex:0 0 auto}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-head h2 .num{color:var(--dim);font-weight:400;font-size:12px}
.tools{display:flex;align-items:center;gap:7px}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid transparent;width:180px;transition:.15s}
.search:focus-within{border-color:rgba(59,123,250,.55);background:rgba(59,123,250,.07)}
.search input{flex:1;font-size:12px;min-width:0}
.search input::placeholder{color:var(--dim)}
.seg{display:flex;padding:2px;border-radius:7px;background:rgba(255,255,255,.05)}
.seg button{height:25px;padding:0 8px;border-radius:5px;color:var(--muted);display:grid;place-items:center;font-size:11.5px}
.seg button.on{background:rgba(255,255,255,.12);color:var(--text)}
.seg button svg{width:14px;height:14px}
.seg.txt button{padding:0 10px}
.folders{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.folder{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:142px;transition:.15s;text-align:left}
.folder:hover{background:rgba(255,255,255,.07);border-color:var(--line2)}
.folder .fi{width:28px;height:28px;border-radius:7px;background:rgba(247,185,85,.13);display:grid;place-items:center;color:#f7b955}
.folder .fn{font-size:12px;display:block}
.folder .fc{font-size:10px;color:var(--dim);display:block;margin-top:1px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid.list{display:flex;flex-direction:column;gap:6px}
.card{position:relative;text-align:left;border-radius:11px;transition:.16s}
.thumb{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.07);background:#15171c;display:grid;place-items:center}
.card:hover .thumb{border-color:rgba(255,255,255,.22)}
.thumb:after{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,rgba(255,255,255,.05),transparent 70%);pointer-events:none}
.thumb .dur{position:absolute;right:6px;bottom:6px;font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.62);z-index:2}
.thumb .kind{position:absolute;left:6px;top:6px;font-size:9.5px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.5);color:#cfd4de;z-index:2}
.thumb .pl{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.13);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;opacity:0;transition:.18s;z-index:2}
.card:hover .thumb .pl{opacity:1}
.thumb .sync{position:absolute;right:6px;top:6px;font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.5);color:#9ec2ff;display:flex;align-items:center;gap:3px;z-index:2}
.thumb .sync.local{color:#f7c46a}
.card .cname{font-size:12.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cmeta{font-size:10.5px;color:var(--dim);margin-top:2px}
.card .hover{position:absolute;inset:0;border-radius:9px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6));opacity:0;transition:.16s;display:flex;align-items:flex-end;justify-content:flex-end;padding:7px;gap:5px;z-index:3}
.card:hover .hover{opacity:1}
.mini-btn{font-size:10.5px;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.17);backdrop-filter:blur(8px)}
.mini-btn:hover{background:rgba(255,255,255,.3)}
.grid.list .card{display:flex;align-items:center;gap:14px;padding:7px;border-radius:9px}
.grid.list .card:hover{background:rgba(255,255,255,.04)}
.grid.list .thumb{width:126px;aspect-ratio:16/9;flex:0 0 126px}
.grid.list .cbody{flex:1;min-width:0;display:flex;align-items:center;gap:16px}
.grid.list .cname,.grid.list .cmeta{margin:0}
.grid.list .hover{position:static;opacity:1;background:none;padding:0;width:auto}
.empty{padding:40px;text-align:center;color:var(--dim);font-size:12.5px;border:1px dashed var(--line2);border-radius:12px}
.t1{background:radial-gradient(120% 120% at 20% 10%,#5b3b2a,#20161a 60%),linear-gradient(160deg,#3a2a3f,#101014)}
.t2{background:radial-gradient(110% 110% at 70% 20%,#2b4a6b,#111820 60%),linear-gradient(160deg,#22364f,#0e1216)}
.t3{background:radial-gradient(120% 120% at 30% 80%,#5c2b45,#1a1116 60%),linear-gradient(160deg,#3d2133,#0f0c10)}
.t4{background:radial-gradient(110% 120% at 60% 30%,#2f5b52,#101a18 60%),linear-gradient(160deg,#254640,#0d1413)}
.t5{background:radial-gradient(120% 120% at 40% 20%,#6a5836,#211a12 60%),linear-gradient(160deg,#4a3d26,#12100c)}
.t6{background:radial-gradient(110% 120% at 20% 60%,#37405e,#14161f 60%),linear-gradient(160deg,#2b3350,#0e1015)}

/* ================= 编辑器（对齐剪映） ================= */
#screen-editor{flex-direction:column}
.ed-top{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#171819;border-bottom:1px solid var(--line)}
.ed-tl,.ed-tr{display:flex;align-items:center;gap:9px}
.draft-name{font-size:13px;font-weight:500;padding:4px 8px;border-radius:6px;border:1px solid transparent;min-width:80px;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.draft-name:hover{border-color:var(--line2)}
.draft-name:focus{border-color:rgba(59,123,250,.6);background:rgba(59,123,250,.08);outline:none}
.sync-tag{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#8fb6ff;background:rgba(59,123,250,.1);padding:2px 7px;border-radius:4px}
.ed-body{flex:1;display:flex;min-height:0}

/* 左：横排 tab + 树列 + 内容 */
.lib{width:34.2%;min-width:430px;max-width:560px;flex:0 0 auto;background:#1b1c1e;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabsbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:1px;padding:0 4px;border-bottom:1px solid var(--line)}
.tab{width:46px;flex:0 0 46px;height:43px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#a2a7ae;font-size:10px;transition:.15s}
.tab svg{width:17px;height:17px}
.tab:hover{color:#e6e8eb;background:rgba(255,255,255,.045)}
.tab.on{color:#22d3ee}
.tab.on svg{color:#22d3ee}
.libbody{flex:1;display:flex;min-height:0}
.tree{width:120px;flex:0 0 120px;padding:8px 6px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.035)}
.tnode{display:flex;align-items:center;gap:6px;width:100%;height:32px;padding:0 8px;border-radius:5px;font-size:12px;color:#c6cbd4;text-align:left;margin-bottom:3px;transition:.13s}
.tnode.main{background:rgba(255,255,255,.045)}
.tnode:hover{background:rgba(255,255,255,.09)}
.tnode.on{background:rgba(255,255,255,.09);color:#f0f2f5}
.tnode.child{background:none;padding-left:9px}
.tnode.child:hover{background:rgba(255,255,255,.07)}
.tnode .chev{margin-left:auto;color:var(--dim);display:flex;transition:.15s}
.tnode .chev.up{transform:rotate(90deg)}
.content{flex:1;min-width:0;overflow-y:auto;padding:10px 12px}

.drop{height:104px;border:1px dashed rgba(255,255,255,.16);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11px;color:#9aa0a6;line-height:1.9;background:rgba(255,255,255,.02)}
.importcard{height:150px;border-radius:8px;background:#2a2c2f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:.15s}
.importcard:hover{background:#313438}
.importcard .ipc{width:26px;height:26px;border-radius:50%;background:#22d3ee;color:#0b1418;display:grid;place-items:center}
.importcard .ipt{font-size:13px;color:#e9ebef}
.importcard .ips{font-size:11px;color:#9aa0a6}
.importcard .ips b{color:#22d3ee;font-weight:400}
.drop b{color:#7fb0ff;font-weight:500}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .btn{flex:1;height:30px;font-size:11.5px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.media{position:relative;border-radius:5px;overflow:hidden;border:1px solid transparent;cursor:pointer}
.media:hover{border-color:rgba(255,255,255,.2)}
.media .mt{aspect-ratio:16/9;display:grid;place-items:center;font-size:9px;color:rgba(255,255,255,.6)}
.media .mn{font-size:10px;color:#9aa0a6;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .md{position:absolute;right:4px;top:4px;font-size:9px;background:rgba(0,0,0,.62);padding:0 4px;border-radius:2px}
.media .add{position:absolute;inset:auto 4px 20px 4px;height:21px;border-radius:4px;background:rgba(255,255,255,.92);color:#111;font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center}
.media:hover .add{display:flex}
.srow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-radius:5px}
.srow:hover{background:rgba(255,255,255,.04)}
.srow .si{width:26px;height:26px;border-radius:5px;background:rgba(59,123,250,.14);color:#8fb6ff;display:grid;place-items:center;flex:0 0 auto}
.srow .sn{flex:1;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sd{font-size:10px;color:var(--dim);flex:0 0 auto}
.srow .use{font-size:10.5px;color:#7fb0ff;flex:0 0 auto}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.tile{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;cursor:pointer}
.tile:hover{background:rgba(59,123,250,.14);border-color:rgba(59,123,250,.45)}
.fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.fx{cursor:pointer}
.fx .fthumb{aspect-ratio:16/10;border-radius:5px;display:grid;place-items:center;font-size:10px;color:rgba(255,255,255,.75);border:1px solid transparent}
.fx:hover .fthumb{border-color:rgba(59,123,250,.55)}
.fx .fname{font-size:10px;color:#9aa0a6;padding:3px 1px}
.preset{border:1px solid var(--line);border-radius:6px;padding:13px 8px;text-align:center;font-size:12px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));cursor:pointer}
.preset:hover{border-color:rgba(59,123,250,.5);background:rgba(59,123,250,.1)}
.preset b{display:block;font-size:14px;margin-bottom:3px}
.preset span{font-size:9.5px;color:var(--dim)}
.kv{display:flex;align-items:center;gap:8px;margin-top:9px}
.kv label{font-size:10.5px;color:var(--dim);width:44px;flex:0 0 44px;white-space:nowrap}
.kv .val{font-size:10.5px;color:#9aa0a6;width:36px;text-align:right;flex:0 0 36px}
.slider{-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.16);flex:1}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}

/* 中：预览区 */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#0d0e10}
.stage-head{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;color:#9aa0a6}
.stage-view{flex:1;display:grid;place-items:center;padding:6px 30px;min-height:0}
.player{position:relative;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.45);display:grid;place-items:center;overflow:hidden;aspect-ratio:16/9;height:100%;max-width:100%;max-height:100%}
.player.r9-16{aspect-ratio:9/16}
.player.r1-1{aspect-ratio:1/1}
.player.r4-3{aspect-ratio:4/3}
.pv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.5);font-size:12px;background:#000}
.pv .pico{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;margin:0 auto 10px}
.pvbar{height:44px;flex:0 0 44px;display:flex;align-items:center;padding:0 14px;gap:10px;font-size:11px;color:#9aa0a6}
.pvbar-l{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:#cfd4da;min-width:170px}
.pvbar-l i{color:#5c626b;font-style:normal}
.pvbar-l .dim{color:#8b9098}
.pvbar-c{flex:1;display:flex;justify-content:center}

/* 右：属性 */

.pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 16px}

.prow{display:flex;align-items:center;gap:10px;height:44px;font-size:12px;color:#a9aeb6}

.numbox{display:flex;align-items:center;height:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:5px;padding:0 6px;font-size:11px;color:#e2e5ea;min-width:74px;justify-content:space-between;gap:6px}
.numbox .stp{display:flex;flex-direction:column;color:#6b7178;line-height:0}
.numbox .stp i{font-style:normal;font-size:7px;line-height: 4px}
.prow .kb{color:#4f555d;font-size:11px;display:flex;gap:6px;flex:0 0 auto}
.sw{width:32px;height:17px;border-radius:9px;background:rgba(255,255,255,.16);position:relative;flex:0 0 auto;cursor:pointer;transition:.15s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#22d3ee}

.align-row{display:flex;gap:5px;margin:8px 0 2px}

.align-row button:hover{background:rgba(255,255,255,.12);color:#e9ebef}
.param{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.param:last-child{border-bottom:0}

.param .v{color:#dfe2e7;font-size:12px;word-break:break-all;line-height:1.5}
.param .v.dim{color:#8b9098}
.param .v.blue{color:#7fb0ff}
.promo{margin:10px 12px 16px;padding:9px 11px;border-radius:6px;background:rgba(247,185,85,.1);border:1px solid rgba(247,185,85,.22);font-size:10.5px;color:#e8c07b;line-height:1.65}
.modify-btn{margin:6px 12px 0;height:32px;border-radius:6px;background:rgba(255,255,255,.08);font-size:12px;color:#e2e5ea;display:flex;align-items:center;justify-content:center}
.modify-btn:hover{background:rgba(255,255,255,.13)}


.tarea{width:100%;min-height:66px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 9px;font-size:12px;color:#e6e8eb;resize:none;line-height:1.6;font-family:inherit}
.tarea:focus{border-color:rgba(59,123,250,.6);outline:none}
.colrow{display:flex;gap:7px;align-items:center}
.col{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.22);cursor:pointer}
.col.on{box-shadow:0 0 0 2px rgba(59,123,250,.85)}
.biub{display:flex;gap:4px}
.biub button{width:26px;height:26px;border-radius:5px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:12px;color:#a9aeb6}
.biub button.on{background:rgba(59,123,250,.2);color:#9ec2ff}
.pselect{flex:1;height:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:0 8px;color:#e6e8eb;font-size:11.5px}
.numin{width:64px;height:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:0 6px;font-size:11px;color:#e6e8eb;text-align:center}
.numin:focus{border-color:rgba(59,123,250,.6);outline:none}
.stepbtn{width:16px;height:13px;display:grid;place-items:center;color:#6b7178;font-size:8px;line-height:1}
.stepbtn:hover{color:#dfe2e7}
.segmini{display:flex;background:rgba(255,255,255,.05);border-radius:5px;padding:2px}
.segmini button{height:22px;padding:0 10px;border-radius:4px;font-size:10.5px;color:#9aa0a6}
.segmini button.on{background:rgba(255,255,255,.12);color:#e9ebef}


.mask-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.mask-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:#a9aeb6}
.mask-item svg{width:22px;height:22px}
.mask-item span{font-size:9.5px;color:#8b9098}
.mask-item:hover{background:rgba(255,255,255,.08);color:#e6e8eb}
.mask-item.on{border-color:rgba(59,123,250,.65);background:rgba(59,123,250,.14);color:#9ec2ff}
.mask-item.on span{color:#9ec2ff}
.flower-item{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.flower-item span{font-size:9.5px;color:#8b9098;text-align:center}
.flower-item:hover .fthumb{border:1px solid rgba(59,123,250,.6)}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:11.5px;color:#8b9098;border-bottom:1px solid rgba(255,255,255,.03)}
.info-row:last-child{border-bottom:0}
.info-row span:last-child{color:#dfe2e7}


/* 草稿参数 */
.dparams{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 4px}
.drow{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:9px 0;font-size:12px}
.drow .k{color:#8c939e;display:flex;align-items:center;gap:4px;line-height:1.4}
.drow .k i{font-style:normal;font-size:9.5px;color:#4f555d;border:1px solid #3d424a;border-radius:50%;width:11px;height:11px;display:inline-grid;place-items:center;flex:0 0 auto}
.drow .v{color:#e4e7eb;font-size:12px;line-height:1.45;word-break:break-all}
.drow .v.dim{color:#9aa0a6}
.drow .v.blue{color:#22d3ee}
.dsep{height:1px;background:rgba(255,255,255,.07);margin:6px 0}
.dfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.05);background:#1a1b1e}
.dfoot .promo{flex:1;margin:0;padding:7px 9px;font-size:10px;line-height:1.45;border-radius:4px;background:#f5d76e;color:#20201d}
.modify-btn{width:78px;height:26px;border-radius:5px;background:#3a3d42;font-size:11.5px;color:#e4e7eb;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:0}
.modify-btn:hover{background:#464a50}


.libbar{display:flex;align-items:center;gap:5px;margin:0 0 8px}
.libbar .imp{height:26px;padding:0 8px;border-radius:4px;background:rgba(255,255,255,.07);font-size:11px;color:#dfe2e7;display:flex;align-items:center;gap:4px}
.libbar .imp:hover{background:rgba(255,255,255,.12)}
.libbar .sb{flex:1;min-width:0;height:26px;border-radius:4px;background:rgba(255,255,255,.05);display:flex;align-items:center;gap:5px;padding:0 7px;color:#7c828a}
.libbar .sb input{flex:1;font-size:11px;min-width:0}
.libbar .sb input::placeholder{color:#6b7178}
.libbar .ib{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:#9aa0a6;flex:0 0 auto}
.libbar .ib:hover{background:rgba(255,255,255,.08);color:#e9ebef}
.liball{font-size:10.5px;color:#8c939e;margin:2px 0 5px}

/* 底部时间线 */
.tl{height:43.2vh;min-height:330px;max-height:520px;flex:0 0 auto;background:#151617;border-top:1px solid var(--line);display:flex;flex-direction:column}
.tl-tools{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.04);overflow:hidden}
.tool{height:28px;flex:0 0 auto;min-width:31px;padding:0 5px;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#a8adb5}
.tool:hover{background:rgba(255,255,255,.07);color:#f2f4f7}
.tool svg{width:17px;height:17px}
.sep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 6px}
.tl-right{margin-left:auto;display:flex;align-items:center;gap:6px;color:#8b9098;font-size:11px;flex:0 0 auto}
.tl-body{flex:1;display:flex;min-height:0}
.tl-heads{width:132px;flex:0 0 132px;border-right:1px solid rgba(255,255,255,.05);padding-top:24px}
.thead{display:flex;align-items:center;gap:1px;padding:0 6px}
.ttype{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;color:#8b9098;margin-right:2px}
.ttype svg,.ticon svg{width:15px;height:15px}
.ticon{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:#7c828a}
.ticon:hover{background:rgba(255,255,255,.08);color:#dfe2e7}
.ticon.on{color:#7fb0ff}
.tl-scroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.tl-inner{position:relative;min-width:100%;height:100%;padding-top:24px}
.ruler{position:absolute;top:0;left:0;right:0;height:24px;display:flex;font-size:9.5px;color:#71767d}
.ruler span{flex:1;border-left:1px solid rgba(255,255,255,.05);padding-left:5px;line-height:22px;min-width:64px}
.track{height:52px;position:relative;border-bottom:1px solid rgba(255,255,255,.025)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.35);display:flex;align-items:center;padding:0 7px;font-size:10.5px;white-space:nowrap;background:linear-gradient(180deg,#2b6e6a,#1f5250)}
.clip.v{background:linear-gradient(180deg,#2b6e6a,#1f5250)}
.clip.v:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 44px);opacity:.7}
.clip.a{background:linear-gradient(180deg,#2f6a52,#1f4a39)}
.clip.t{background:linear-gradient(180deg,#7a5c2a,#57401d)}
.clip.img{background:linear-gradient(180deg,#3a5f7a,#25404f)}
.clip.effect{background:linear-gradient(180deg,#7a5ca8,#4f3a70)}
.clip.img:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
.clip.on{outline:2px solid #fff;outline-offset:-2px}
.clip .cn{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.clip .wave{position:absolute;inset:0;opacity:.3;background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.35) 3px 4px)}
.clip.v:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 22px);opacity:.5}
.ph{position:absolute;top:0;bottom:0;width:1px;background:#f2f3f5;z-index:6;pointer-events:none}
.ph:before{content:"";position:absolute;top:0;left:-5px;width:11px;height:11px;background:#f2f3f5;border-radius:1px}
.hint{position:absolute;inset:24px 16px 14px;border:1px dashed rgba(255,255,255,.1);border-radius:4px;display:grid;place-items:center;color:#6b7178;font-size:11.5px;pointer-events:none}

/* ================= 幕布 ================= */
#screen-canvas{user-select:none;background:#0b0b0c}
.cv-bg{position:absolute;inset:0;background:#0b0b0c;cursor:grab}
.cv-bg.drag{cursor:grabbing}
.cv-world{position:absolute;inset:0;transform-origin:0 0}
.cv-links{position:absolute;inset:0;overflow:visible;pointer-events:none}


/* 画布缩略图：更像照片 */
.cthumb.t1{background:linear-gradient(165deg,#6b4530 0%,#3a2620 55%,#1c1416 100%)}
.cthumb.t2{background:linear-gradient(165deg,#2f5678 0%,#1b3348 55%,#0e141b 100%)}
.cthumb.t3{background:linear-gradient(165deg,#7a3550 0%,#42202f 55%,#1a1015 100%)}
.cthumb.t4{background:linear-gradient(165deg,#2f6a5e 0%,#1b3a34 55%,#0c1514 100%)}
.cthumb.t5{background:linear-gradient(165deg,#8a6a3a 0%,#463420 55%,#1a140d 100%)}
.cthumb.t6{background:linear-gradient(165deg,#3a4668 0%,#222a3f 55%,#0e1017 100%)}
.cthumb:after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 20%,rgba(255,255,255,.12),transparent 70%);pointer-events:none}

/* 节点：缩略图 + 说明条 */
.cnode{position:absolute;cursor:grab;user-select:none}
.cnode:active{cursor:grabbing}
.cthumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#15161a;transition:.15s}
.cnode:hover .cthumb{border-color:rgba(255,255,255,.3)}
.cnode.on .cthumb{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee}
.cnode .play{position:absolute;left:6px;bottom:6px;width:20px;height:20px;border-radius:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:grid;place-items:center}
.cnode .kindtag{position:absolute;right:6px;top:6px;font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.55);color:#cfd4da}
.ccap{display:flex;align-items:center;gap:5px;margin-top:6px;color:#b8bcc2;font-size:10.5px;max-width:100%}
.ccap svg{flex:0 0 auto;opacity:.8}
.ccap .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccap .info{flex:0 0 auto;opacity:0;font-size:9px;transition:.15s}
.cnode:hover .ccap .info{opacity:.6}

/* 生成类节点（脚本） */
.ctext{border-radius:8px;background:#16171b;border:1px solid rgba(255,255,255,.1);padding:12px;font-size:10.5px;line-height:1.75;color:#c9ced6;white-space:pre-wrap}
.cnode:hover .ctext{border-color:rgba(255,255,255,.28)}

/* 剪辑箱节点 */
.cbox{border-radius:8px;background:#16171b;border:1px solid rgba(255,255,255,.1);padding:10px}
.cbox-h{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;color:#8c939e;margin-bottom:7px}
.cbox .mtl{position:relative;height:72px;border-radius:4px;background:rgba(255,255,255,.03);overflow:hidden}
.cbox .mtl-row{position:relative;height:23px;border-bottom:1px solid rgba(255,255,255,.03)}
.cbox .mclip{position:absolute;top:3px;height:17px;border-radius:3px;font-size:8px;display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:grab;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#2b6e6a,#1f5250)}
.cbox .mclip.a{background:linear-gradient(180deg,#2f6a52,#1f4a39)}
.cbox .mclip.t{background:linear-gradient(180deg,#7a5c2a,#57401d)}
.cbox .mclip.on{outline:1.5px solid #22d3ee;outline-offset:-1px}
.cbox .mclip .trim{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize;background:rgba(255,255,255,.25)}
.cbox .mph{position:absolute;top:0;bottom:0;width:1px;background:#f2f3f5;z-index:4;pointer-events:none}
.cbox-f{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:9px;color:#6b7178}

/* 悬浮操作 */
.cact{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:flex-end;padding:6px;opacity:0;transition:.15s;background:linear-gradient(180deg,transparent,rgba(0,0,0,.65))}
.cnode:hover .cact{opacity:1}
.cact button{height:22px;padding:0 7px;border-radius:4px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-size:9.5px;color:#fff}
.cact button:hover{background:rgba(255,255,255,.26)}
.cact button.pri{background:#22d3ee;color:#08161a;font-weight:600}

/* 顶部 */
.cv-top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;pointer-events:none}
.cv-top > *{pointer-events:auto}
.cv-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:#f0f2f5}
.cv-title .ep{font-weight:400;color:#c9ced6;font-size:13px}
.cv-title .back{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#c9ced6}
.cv-title .back:hover{background:rgba(255,255,255,.1)}
.cv-acct{display:flex;align-items:center;gap:8px}
.cv-acct .cir{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#c9ced6}
.cv-acct .cir:hover{background:rgba(255,255,255,.14)}
.cv-acct .bell{width:26px;height:26px;display:grid;place-items:center;color:#c9ced6}
.cv-acct .token{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.07);font-size:11.5px;color:#f0f2f5}
.cv-acct .lang{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:rgba(255,255,255,.07);font-size:11.5px;color:#e6e8eb}
.cv-acct .ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#f472b6);display:grid;place-items:center;font-size:12px;font-weight:700;color:#2b0f2e}

/* 左侧工具条 */
.cv-tools{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:44px;padding:6px;border-radius:16px;background:rgba(30,31,34,.92);border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10;backdrop-filter:blur(12px)}
.ctool{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#a8adb5;position:relative}
.ctool:hover{background:rgba(255,255,255,.1);color:#f0f2f5}
.ctool.on{background:rgba(255,255,255,.12);color:#f0f2f5}
.ctool.primary{background:#f5f6f7;color:#111;width:32px;height:32px;border-radius:9px}
.ctool.primary:hover{background:#fff}
.ctool .tip{position:absolute;left:42px;top:50%;transform:translateY(-50%);background:#26282d;border:1px solid rgba(255,255,255,.1);color:#e9ebef;font-size:10.5px;padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:20}
.ctool:hover .tip{opacity:1}
.ctool-sep{width:22px;height:1px;background:rgba(255,255,255,.1);margin:3px 0}

/* 缩放胶囊 */
.cv-zoom{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:2px;padding:6px 8px;border-radius:22px;background:rgba(30,31,34,.94);border:1px solid rgba(255,255,255,.08);z-index:10;backdrop-filter:blur(12px)}
.cv-zoom button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#c9ced6}
.cv-zoom button:hover{background:rgba(255,255,255,.1)}
.cv-zoom .zslider{-webkit-appearance:none;width:96px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 6px}
.cv-zoom .zslider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.cv-zoom .pct{font-size:11px;color:#e6e8eb;min-width:34px;text-align:center}
.cv-zoom .dv{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 6px}

/* 右下角计数 */
.cv-counts{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;z-index:10}
.cv-counts span{display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;background:rgba(30,31,34,.94);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#e6e8eb}

/* 提示 */
.cv-hint{position:absolute;left:50%;top:54px;transform:translateX(-50%);font-size:10px;color:#5f646d;z-index:5;display:flex;gap:10px}
.cv-hint kbd{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:0 4px;font-size:9.5px}


/* 连线选中 / 命中区 */
.cv-links .lk{stroke:rgba(255,255,255,.22);stroke-width:1;fill:none}
.cv-links .lk.sel{stroke:#22d3ee;stroke-width:1.6}
.cv-links .lk-hit{stroke:transparent;stroke-width:12;fill:none;pointer-events:stroke;cursor:pointer}
.cv-links .lk-tmp{stroke:#22d3ee;stroke-width:1.2;stroke-dasharray:4 3;fill:none}

/* 连线端口 */
.port{position:absolute;right:-7px;top:38%;width:14px;height:14px;border-radius:50%;background:#1b1c1e;border:1.5px solid rgba(255,255,255,.45);opacity:0;transition:.15s;cursor:crosshair;z-index:3}
.port:after{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(255,255,255,.6)}
.cnode.playing .play{opacity:0}
.cnode:hover .port{opacity:1}
.port.l{right:auto;left:-7px}
.nlabel{position:absolute;left:0;top:-21px;display:flex;align-items:center;gap:5px;font-size:11px;color:#8b9098;white-space:nowrap;pointer-events:none}
.nlabel svg{width:12px;height:12px;opacity:.8}
.nbadge{position:absolute;left:6px;top:6px;z-index:2;font-size:9px;line-height:1;padding:3px 5px;border-radius:3px;background:rgba(0,0,0,.6);color:#cfd4da;border:1px solid rgba(255,255,255,.16)}
.ndur{position:absolute;right:6px;bottom:6px;z-index:2;font-size:9.5px;padding:2px 4px;border-radius:3px;background:rgba(0,0,0,.62);color:#e6e8eb}
.cnode.on .nlabel{color:#22d3ee}
.port:hover{border-color:#22d3ee;background:#0e1416}
.port:hover:after{background:#22d3ee}

/* 框选 */
.marquee{position:absolute;border:1px solid rgba(34,211,238,.7);background:rgba(34,211,238,.08);border-radius:2px;pointer-events:none;z-index:8}

/* 右键菜单 */
.ctxmenu{position:fixed;min-width:172px;background:#1e2024;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:300;font-size:12px}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px;border-radius:5px;color:#dfe2e7;text-align:left}
.ctxmenu button:hover{background:rgba(255,255,255,.08)}
.ctxmenu button.danger{color:#ff8087}
.ctxmenu .sep{height:1px;background:rgba(255,255,255,.07);margin:4px 2px}
.ctxmenu .lb{font-size:10px;color:#6b7178;padding:5px 9px 3px}

/* 节点类型菜单（＋） */
.addmenu{position:fixed;width:190px;background:#1e2024;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:300}
.addmenu button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 9px;border-radius:5px;color:#dfe2e7;font-size:12px;text-align:left}
.addmenu button:hover{background:rgba(255,255,255,.08)}
.addmenu button i{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-style:normal;font-size:11px}

/* 全屏预览 */
.pvmask{position:fixed;inset:0;background:rgba(5,6,8,.92);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:400;animation:fade .15s}
.pvbox{max-width:74vw;max-height:82vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.pvbox .big{border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12)}
.pvbox .cap{font-size:12px;color:#c9ced6}
.pvbox .close{position:absolute;top:22px;right:26px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}

/* 选中计数条 */
.selbar{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-radius:20px;background:rgba(30,31,34,.96);border:1px solid rgba(255,255,255,.1);z-index:12;font-size:11.5px;color:#dfe2e7}
.selbar.on{display:flex}
.selbar button{height:24px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.1);font-size:11px}
.selbar button:hover{background:rgba(255,255,255,.18)}
.selbar button.danger{color:#ff8b91}


.compose{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;border-radius:8px;background:#16171b;border:1px solid rgba(255,255,255,.1)}
.cnode:hover .compose{border-color:rgba(255,255,255,.28)}
.cmpcell{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden}
.cmpcell .tag{position:absolute;left:4px;top:4px;font-size:8.5px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.6);color:#9ec2ff}

.clipbtn{position:absolute;left:18px;bottom:64px;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:rgba(30,31,34,.95);border:1px solid rgba(255,255,255,.1);color:#dfe2e7;font-size:11.5px;z-index:11;backdrop-filter:blur(12px)}
.clipbtn:hover{background:rgba(44,46,50,.96)}
.clipbtn b{color:#22d3ee;font-weight:500}
.clipdrawer{z-index:22}


/* 抽屉（素材库 / 剪辑箱） */
.drawer{position:absolute;top:0;right:0;bottom:0;width:340px;background:#141619;border-left:1px solid rgba(255,255,255,.1);transform:translateX(100%);transition:.25s;z-index:20;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer.clipdrawer{z-index:22;width:380px}
.drawer-h{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px;color:#dfe2e7}
.drawer-b{flex:1;overflow-y:auto;padding:12px}
.drawer-f{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:8px}
.drawer-f .btn{flex:1;height:32px}
.asset{display:flex;gap:9px;align-items:center;padding:8px;border-radius:7px;border:1px solid transparent}
.asset:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.asset .at{width:52px;height:30px;border-radius:4px;flex:0 0 52px}
.asset .an{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .am{font-size:9.5px;color:#6b7178;display:block;margin-top:2px}


/* 底部提示词工作台（composer） */
.composer{position:absolute;left:0;top:0;z-index:40;width:720px;background:#1c1d20;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px 12px;z-index:18;box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .14s}
.composer.on{opacity:1;pointer-events:auto}
.composer .cmp-title{display:flex;align-items:center;gap:7px;font-size:11px;color:#8b9098;margin-bottom:9px}
.composer .cmp-title b{color:#dfe2e7;font-weight:500;font-size:11.5px}
.cmp-tabs{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cmp-tabs button{height:28px;padding:0 11px;border-radius:6px;font-size:12.5px;color:#9aa0a6}
.cmp-tabs button:hover{background:rgba(255,255,255,.06);color:#e6e8eb}
.cmp-tabs button.on{background:#f2f3f5;color:#16171a;font-weight:500}
.cmp-refs{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cmp-thumb{position:relative;width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.12);flex:0 0 auto}
.cmp-thumb .x{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:9px;display:grid;place-items:center}
.cmp-add{width:52px;height:52px;border-radius:8px;border:1px dashed rgba(255,255,255,.22);display:grid;place-items:center;color:#8b9098;flex:0 0 auto}
.cmp-add:hover{background:rgba(255,255,255,.05);color:#e6e8eb}
.cmp-style{height:52px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9aa0a6;font-size:10px}
.cmp-prompt{width:100%;min-height:64px;max-height:120px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;font-size:13.5px;color:#e9ebef;resize:none;line-height:1.7;font-family:inherit}
.cmp-prompt::placeholder{color:#6b7178}
.cmp-prompt:focus{border-color:rgba(255,255,255,.2);outline:none}
.cmp-bar{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:#c9ced6;white-space:nowrap;overflow:hidden}
.cmp-bar .mdl{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;white-space:nowrap;border-radius:6px;color:#e6e8eb;font-weight:500}
.cmp-bar .mdl:hover{background:rgba(255,255,255,.06)}
.cmp-bar .meta{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;white-space:nowrap;border-radius:6px;color:#c9ced6}
.cmp-bar .meta:hover{background:rgba(255,255,255,.06)}
.cmp-bar .ib{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#c9ced6}
.cmp-bar .ib:hover{background:rgba(255,255,255,.06)}
.cmp-bar .sp{flex:1}
.cmp-bar .price{font-size:11.5px;color:#e6e8eb;padding:0 4px;white-space:nowrap}
.cmp-send{width:40px;height:40px;border-radius:50%;background:#f2f3f5;color:#111;display:grid;place-items:center;flex:0 0 auto}
.cmp-send:hover{background:#fff}


/* 底部工具栏 */
.cv-toolsbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;height:46px;padding:0 8px;border-radius:11px;background:rgba(30,31,34,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:12;backdrop-filter:blur(14px)}
.cv-toolsbar button{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#c3c8cf;position:relative}
.cv-toolsbar button:hover{background:rgba(255,255,255,.08);color:#fff}
.cv-toolsbar button.act{background:rgba(34,211,238,.16);color:#22d3ee}
.cv-toolsbar .tip{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);font-size:10.5px;padding:3px 8px;border-radius:5px;background:#2c2d31;color:#e6e8eb;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s}
.cv-toolsbar button:hover .tip{opacity:1}
.cv-toolsbar .dv{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 5px}

/* 项目菜单 */
.cv-menu{position:absolute;left:14px;top:54px;width:196px;padding:6px;border-radius:9px;background:#1d1e22;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:16;display:none}
.cv-menu.on{display:block}
.cv-menu button{width:100%;height:32px;display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:6px;font-size:12px;color:#dfe2e7}
.cv-menu button:hover{background:rgba(255,255,255,.07)}
.cv-menu svg{width:14px;height:14px;opacity:.8}
.cv-menu .sep{height:1px;background:rgba(255,255,255,.08);margin:5px 4px}

/* 小地图 */
.minimap{position:absolute;right:16px;bottom:70px;width:180px;height:120px;border-radius:10px;background:rgba(24,25,28,.96);border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:15;display:none;overflow:hidden;cursor:crosshair}
.minimap.on{display:block}
.minimap .mnode{position:absolute;border-radius:2px;background:rgba(255,255,255,.28)}
.minimap .mnode.on{background:#22d3ee}
.minimap .mview{position:absolute;border:1px solid rgba(34,211,238,.85);background:rgba(34,211,238,.08);border-radius:2px}
.minimap .mh{position:absolute;left:0;right:0;top:0;height:20px;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent);font-size:9px;color:#8b9098;display:flex;align-items:center;padding:0 7px;pointer-events:none}

/* 画布里的空节点入口 */
.addcard{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-radius:10px;border:1px dashed rgba(255,255,255,.24);background:rgba(255,255,255,.02);color:#8b9098;font-size:12px;cursor:pointer;z-index:1}
.addcard:hover{border-color:rgba(255,255,255,.45);color:#e6e8eb;background:rgba(255,255,255,.05)}
.addcard svg{opacity:.8}

.cv-video{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
.cthumb{overflow:hidden}

/* 选中节点上方的浮动操作条 */
.nodetools{position:absolute;display:none;align-items:center;gap:2px;height:38px;padding:0 6px;border-radius:8px;background:rgba(32,33,37,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:14;backdrop-filter:blur(12px);white-space:nowrap}
.nodetools.on{display:flex}
.nodetools button{height:28px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:5px;font-size:11.5px;color:#dfe2e7}
.nodetools button:hover{background:rgba(255,255,255,.1)}
.nodetools button svg{width:14px;height:14px;opacity:.9}
.nodetools .dv{width:1px;height:16px;background:rgba(255,255,255,.12);margin:0 4px}
.nodetools .car{width:8px;height:8px;opacity:.6}

/* 图标式右键菜单 */
.ctxmenu button{height:34px;gap:10px}
.ctxmenu button svg{width:15px;height:15px;opacity:.85;flex:0 0 auto}

/* 新建节点菜单（图标块） */
.addmenu{padding:8px;width:210px}
.addmenu .up{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border:1px dashed rgba(255,255,255,.22);border-radius:7px;margin-bottom:6px;color:#dfe2e7;font-size:12.5px;width:100%}
.addmenu .up:hover{background:rgba(255,255,255,.06)}
.addmenu button.mi{height:42px;gap:10px;font-size:12.5px}
.addmenu button.mi i{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.addmenu button.mi i svg{width:14px;height:14px}

/* 全屏预览（对齐真实） */
.pvmask{background:rgba(8,9,11,.94)}
.pvbox{position:relative;max-width:88vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:14px}
.pvstage{position:relative;display:flex;align-items:center;gap:26px}
.pvframe{position:relative;display:flex;align-items:center;justify-content:center;max-width:min(78vw,760px)}
.pv-video{max-width:100%;max-height:66vh;border-radius:6px;background:#000;display:block}
.pvmedia{width:min(38vw,420px);aspect-ratio:9/16;max-height:64vh;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.pvmedia.t1{background:linear-gradient(165deg,#6b4530,#3a2620 55%,#1c1416)}
.pvmedia.t2{background:linear-gradient(165deg,#2f5678,#1b3348 55%,#0e141b)}
.pvmedia.t3{background:linear-gradient(165deg,#7a3550,#42202f 55%,#1a1015)}
.pvmedia.t4{background:linear-gradient(165deg,#2f6a5e,#1b3a34 55%,#0c1514)}
.pvarrow{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff}
.pvarrow:hover{background:rgba(255,255,255,.16)}
.pvplayer{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));font-size:10.5px;color:#dfe2e7}
.pvplayer .bar{flex:1;height:2px;background:rgba(255,255,255,.25);border-radius:2px;position:relative;margin:0}
.pvplayer .bar i{position:absolute;left:0;top:0;bottom:0;width:8%;background:#fff;border-radius:2px}
.pvstrip{display:flex;gap:8px}
.pvstrip .th{width:46px;height:82px;border-radius:4px;border:1px solid rgba(255,255,255,.15);opacity:.65}
.pvstrip .th.on{border-color:#fff;opacity:1}
.pvdownload{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff}

/* ================= 弹层 ================= */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;animation:fade .16s}
@keyframes fade{from{opacity:0}}
.modal{width:440px;max-width:calc(100vw - 36px);background:#1a1b1e;border:1px solid var(--line2);border-radius:13px;box-shadow:var(--sh);overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal-h{padding:15px 17px 8px;display:flex;align-items:center;justify-content:space-between}
.modal-h h3{font-size:13.5px;font-weight:600}
.modal-b{padding:8px 17px 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.modal-f{padding:11px 17px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.modal input[type=text]{width:100%;height:34px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:7px;padding:0 10px;color:var(--text);font-size:12.5px}
.modal input[type=text]:focus{border-color:rgba(59,123,250,.7)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.opt:last-child{border:0}
.opt select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 7px;color:var(--text);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#24272e;border:1px solid var(--line2);padding:9px 15px;border-radius:8px;font-size:12px;box-shadow:var(--sh);z-index:200;display:flex;align-items:center;gap:7px;animation:up .18s}
@keyframes up{from{transform:translate(-50%,8px);opacity:0}}
.toast .tic{width:15px;height:15px;border-radius:50%;background:rgba(62,207,142,.16);color:#5fe0ab;display:grid;place-items:center;font-size:9px}
.trash-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trash-item .tt{width:50px;height:28px;border-radius:4px;flex:0 0 50px}
.trash-item .tm{flex:1;font-size:12px}
.trash-item .tm a{display:block;font-size:10px;color:var(--dim)}
.trash-item button{font-size:11px;color:#9ec2ff}
.progress-line{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:11px 0}
.progress-line i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.help-list{font-size:12px;line-height:2;color:var(--muted)}
.help-list b{color:var(--text);font-weight:500}
/* 视频节点内的播放器 */
.cnode .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;color:#fff;z-index:4;backdrop-filter:blur(2px)}
.cnode .vplay:hover{background:rgba(0,0,0,.62)}
.cnode.playing .vplay{display:none}
.cnode .vmute{position:absolute;left:7px;top:7px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);display:none;place-items:center;color:#fff;z-index:4}
.cnode.playing .vmute{display:grid}

@media(max-width:580px){.wp-library>header{gap:10px;flex-wrap:wrap;padding:12px;min-height:75px}.wp-library>header>h2{font-size:17px}.wp-library>header nav{order:3;width:100%;min-height:32px}.wp-library>header nav>button[aria-pressed="true"]:after{bottom:0}.wp-library-layout>aside{flex-basis:95px}.wp-library-layout>main{padding:12px}.wp-preset-grid{grid-template-columns:1fr}.wp-preset-detail,.wp-preset-form{padding:18px}.wp-library .wp-new-preset{margin-left:auto}.wp-library-close{width:22px}}

.wp-preset-card-body h3>button{display:block;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;font:inherit}.wp-preset-card-body h3>button:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}

</style>
</head>
<body>

<!-- ==================== 首页 ==================== -->
<section class="screen active" id="screen-home">
  <aside class="side">
    <div class="brand"><span class="mk">幕</span><b data-brand>双幕</b><span class="tag">BETA</span></div>
    <nav class="nav">
      <button class="nav-item on" data-go="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg>首页</button>
      <button class="nav-item" data-go="editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 12h18"/></svg>剪辑器</button>
      <button class="nav-item" data-go="canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="8" r="2.3"/><circle cx="10" cy="18" r="2.3"/><path d="M8.3 6.6 15.7 7.5M7.2 8.2l1.7 7.6M16.6 10.2l-4.7 5.9"/></svg>幕布 <span class="new">NEW</span></button>
      <button class="nav-item" data-trash="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>最近删除</button>
    </nav>
    <div class="side-gap"></div>
    <div class="side-foot">
      <button class="nav-item" data-help="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></svg>原型说明</button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.5 6.5 5 5M19 19l-1.5-1.5M17.5 6.5 19 5M5 19l1.5-1.5"/></svg>设置</button>
      <div class="user"><span class="avatar">蓝</span><div><b>冯翔艺蓝</b><span>团队版 · 双端已同步</span></div></div>
    </div>
  </aside>

  <main class="home-main">
    <header class="home-top">
      <div class="crumb">首页 / <b>剪辑器</b></div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>云端同步中 · 已同步 12 个草稿</span>
        <button class="icobtn" data-help="1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <div class="home-scroll"><div class="wrap">
      <button class="hero" id="btn-create">
        <div class="hero-cta"><span class="plus">＋</span>开始创作</div>
        <div class="hero-sub">导入本地素材，或从「幕布」把 AI 生成的图文视频带进来</div>
      </button>

      <button class="hub" id="btn-hub">
        <span class="hub-orb">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="6" cy="6" r="2.1"/><circle cx="18" cy="8" r="2.1"/><circle cx="10" cy="18" r="2.1"/><path d="M8.2 6.5 15.8 7.6M7.3 8.1l1.5 7.7M16.5 10.1l-4.6 6.1"/></svg>
        </span>
        <div class="hub-txt">
          <h3>幕布 · 生文 / 生图 / 生视频 <span class="mini">BETA</span></h3>
          <p>在幕布上生成与粗剪，好后存入素材库，再到剪辑器精剪成片</p>
        </div>
        <div class="hub-preview"><span class="hub-node">文</span><span class="hub-node">图</span><span class="hub-node">视</span></div>
        <span class="hub-go">进入幕布
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
        </span>
      </button>

      <div class="sec-head">
        <h2>我的草稿 <span class="num" id="draft-count">0</span></h2>
        <div class="tools">
          <div class="seg txt" id="sync-seg">
            <button class="on" data-sync="all">全部</button>
            <button data-sync="cloud">云端</button>
            <button data-sync="local">本地</button>
          </div>
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input id="draft-search" placeholder="搜索草稿名称">
          </label>
          <div class="seg" id="view-seg">
            <button class="on" data-view="grid" title="宫格"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg></button>
            <button data-view="list" title="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
          </div>
          <button class="btn ghost sm" id="btn-sort">修改时间
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="btn ghost sm" id="btn-newfolder">＋ 新建文件夹</button>
          <button class="btn ghost sm" id="btn-trash">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>最近删除</button>
        </div>
      </div>

      <div class="folders" id="folders"></div>
      <div class="grid" id="draft-grid"></div>
    </div></div>
  </main>
</section>

<!-- ==================== 剪辑器 ==================== -->
<section class="screen" id="screen-editor">
  <header class="ed-top">
    <div class="ed-tl">
      <button class="icobtn" data-go="home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 6l-6 6 6 6"/></svg>
      </button>
      <div class="draft-name" contenteditable="true" spellcheck="false">未命名工程</div>
      <span class="sync-tag" id="from-canvas" style="display:none;cursor:pointer" title="返回画布">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.6 1.5A3.5 3.5 0 0 1 17 18z"/></svg>
        <span id="from-canvas-txt">来自画布</span>
      </span>
      <span class="sync-tag">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.6 1.5A3.5 3.5 0 0 1 17 18z"/></svg>
        已同步到云端
      </span>
    </div>
    <div class="ed-tr">
      <button class="btn ghost" style="height:28px;display:flex;align-items:center;gap:5px" id="btn-to-canvas">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="m4 17.5 4.4-4.4 3.4 3.1 3.1-2.7 5.1 4"/></svg>
        幕布生成
      </button>
      <span class="chip" id="chip-ratio">9:16</span>
      <span class="chip" id="chip-res">1080P</span>
      <button class="btn ghost" style="height:28px">分享</button>
      <button class="btn primary" style="height:28px;padding:0 16px" id="btn-export">导出</button>
    </div>
  </header>

  <div class="ed-body">
    <aside class="lib">
      <div class="tabsbar" id="tabs"></div>
      <div class="libbody">
        <div class="tree" id="tree"></div>
        <div class="content" id="content"></div>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <span>播放器 · 时间线 01</span>
        <button class="icobtn" style="width:22px;height:22px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
      <div class="stage-view"><div class="player" id="player"><div class="pv" id="pv"></div></div></div>
      <div class="pvbar">
        <div class="pvbar-l"><span id="tc-now">00:00:00:00</span><i>/</i><span class="dim" id="tc-total">00:00:12:00</span></div>
        <div class="pvbar-c">
          <button id="btn-play" title="播放">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5.2 19 12 8.5 18.8z"/></svg>
          </button>
        </div>
        <div class="pvbar-r">
          <button class="sbtn" id="qc-quality">原画</button>
          <button class="sbtn" title="适应画布">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4.5h4.5M20 9V4.5h-4.5M4 15v4.5h4.5M20 15v4.5h-4.5"/></svg>
          </button>
          <button class="sbtn" id="btn-ratio">比例</button>
          <button class="sbtn" title="全屏">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4.5h5M20 9V4.5h-5M4 15v4.5h5M20 15v4.5h-5"/></svg>
          </button>
        </div>
      </div>
    </main>

    <aside class="props" id="props"></aside>
  </div>

  <footer class="tl">
    <div class="tl-tools" id="tl-tools"></div>
    <div class="tl-body">
      <div class="tl-heads" id="tl-heads"></div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-inner" id="tl-inner">
          <div class="ruler" id="ruler"></div>
          <div id="tracks"></div>
          <div class="hint" id="tl-hint">素材拖拽到这里，开始你的大作吧~</div>
          <div class="ph" id="ph" style="left:0"></div>
        </div>
      </div>
    </div>
  </footer>
</section>

<!-- ==================== 幕布 ==================== -->
<section class="screen" id="screen-canvas">
  <div class="cv-bg" id="cv-bg"></div>
  <div class="cv-world" id="cv-world">
    <svg class="cv-links" id="cv-links"></svg>
    <div id="cv-nodes"></div>
    <div class="composer" id="composer"></div>
  </div>

  <header class="cv-top">
    <div class="cv-title">
      <button class="back" data-go="home" title="返回">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>
      </button>
      <button class="back" id="cv-menu-btn" title="项目菜单">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15l6-5.5"/></svg>
      </button>
      <div class="cv-menu" id="cv-menu">
        <button data-pm="rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 9 18.5l10-10-3.5-3.5-10 10z"/></svg>重命名画布</button>
        <button data-pm="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建画布</button>
        <div class="sep"></div>
        <button data-pm="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h11l2.5 2.5v12.5H5z"/></svg>保存项目 JSON</button>
        <button data-pm="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>打开项目 JSON</button>
        <div class="sep"></div>
        <button data-pm="draft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="12.5" height="13" rx="2"/><path d="m16 10.2 4.5-2.7v12l-4.5-2.7z"/></svg>剪辑草稿</button>
        <button data-pm="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 5 10l4.5-4.5"/><path d="M5 10h9.5a5 5 0 0 1 0 10H11"/></svg>恢复示例画布</button>
      </div>
    </div>
    <div class="cv-acct">
      <span class="cir" title="帮助">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.4a2.3 2.3 0 1 1 3 2.2c-.6.3-.9.8-.9 1.4v.3"/><circle cx="11.9" cy="16.4" r=".8" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="cir" title="主题">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M6.2 17.8l1.4-1.4M16.4 7.6l1.4-1.4"/></svg>
      </span>
      <span class="bell" title="通知">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 4 1.5 5 1.5 5H5s1.5-1 1.5-5z"/><path d="M10.5 18.5a1.8 1.8 0 0 0 3 0"/></svg>
      </span>
      <span class="ava">韩</span>
    </div>
  </header>

  <aside class="cv-tools">
    <button class="ctool primary" data-cv="add" title="新建节点">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="ctool-sep"></div>
    <button class="ctool" data-cv="script" title="剧本">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h6a2.5 2.5 0 0 1 2.5 2.5v12.5a2 2 0 0 0-2-2H5z"/><path d="M19 4.5h-2.5A2.5 2.5 0 0 0 14 7v12.5a2 2 0 0 1 2-2h3z"/></svg>
      <span class="tip">剧本</span>
    </button>
    <button class="ctool" data-cv="link" title="关联">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 14.5 5-5"/><path d="M12.5 6.2 14 4.7a3.4 3.4 0 0 1 4.8 4.8l-1.5 1.5"/><path d="m11.5 17.8-1.5 1.5a3.4 3.4 0 0 1-4.8-4.8l1.5-1.5"/></svg>
      <span class="tip">关联节点</span>
    </button>
    <button class="ctool" data-cv="assets" title="资产">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8 4.5v8l-8 4.5-8-4.5v-8z"/><path d="m4 8 8 4.5 8-4.5M12 12.5v8"/></svg>
      <span class="tip">资产库</span>
    </button>
    <button class="ctool" data-cv="folder" title="素材库">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      <span class="tip">素材库</span>
    </button>
    <button class="ctool" data-cv="history" title="历史">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/><path d="M12 8v4.5l3 1.8"/></svg>
      <span class="tip">历史版本</span>
    </button>
  </aside>

  <div class="cv-zoom">
    <button data-zoom="-"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <input class="zslider" id="zslider" type="range" min="20" max="200" value="60">
    <span class="pct" id="zoom-pct">60%</span>
    <button data-zoom="+"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="dv"></span>
    <button title="小地图"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><path d="M17 13.5v7M13.5 17h7"/></svg></button>
    <button title="定位 / 小地图" id="btn-locate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></button>
    <button title="适应画布" id="btn-fit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4.5h5M20 9V4.5h-5M4 15v4.5h5M20 15v4.5h-5"/></svg></button>
  </div>

  <div class="cv-counts">
    <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg><b id="cnt-node">5</b></span>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const tc = t => `00:${pad(Math.floor(t / 60))}:${pad(Math.floor(t) % 60)}:${pad(Math.floor((t % 1) * 30))}`;

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tic">✓</span>${esc(msg)}`;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; }, 1900);
  setTimeout(() => el.remove(), 2300);
}
function modal({title, body, footer, width}){
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal" ${width ? `style="width:${width}px"` : ''}>
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icobtn" data-close>✕</button></div>
    <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  $('#modal-root').appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', function esc2(e){ if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', esc2); } });
  return { el: mask, close };
}
function go(screen){
  S.screen = screen;

}

function curClip(){ return S.clips.find(x => x.id === S.selectedClip); }

function clipKind(c){
  if (c.track === 'audio') return 'audio';
  if (c.track === 'text') return 'text';
  if (c.track === 'effect') return 'effect';
  return c.kind === 'image' ? 'image' : 'video';
}

const TAB_MAP = {
  text:  {'文本': ['基础','花字'], '动画': ['基础']},
  video: {'画面': ['基础','蒙版'], '音频': ['基础'], '变速': ['基础']},
  image: {'画面': ['基础','蒙版'], '动画': ['基础']},
  audio: {'基础': ['基础'], '变速': ['基础']},
  effect: {'效果': ['基础']},
};

function renderProps(){
  const c = curClip();
  if (!c) return renderDraftParams();

  const mains = Object.keys(TAB_MAP[k]);
  if (!mains.includes(S.inspTab)) S.inspTab = mains[0];
  const subs = TAB_MAP[k][S.inspTab];

  $('#props').innerHTML = `
    <div class="ptabs" id="ptabs">${mains.map(t =>

}

function propBody(c, k){
  const t = S.inspTab, sub = S.subTab;
  if (k === 'effect'){
    return `<div class="psec" style="border-top:0"><div class="psec-h">效果 · ${esc(c.name)} <span class="r">↺</span></div>
      <div class="prow"><label>强度</label><div class="grow"><input type="range" class="slider" value="60">
        <div class="numbox" style="min-width:70px">60</div></div></div>
      <div class="prow"><label>作用范围</label><div class="grow"><div class="segmini"><button class="on">当前片段</button><button>整条轨道</button></div></div></div>
      <div class="prow"><label>混合</label><div class="grow"><span class="sw on" style="margin-left:auto"></span></div></div>
    </div>`;
  }
  if (k === 'text'){
    if (t === '动画') return textAnim(c);
    return sub === '花字' ? textFlower(c) : textBase(c);
  }
  if (k === 'image'){
    if (t === '动画') return imageAnim(c);
    return sub === '蒙版' ? maskPanel(c) : videoBase(c, '图片');
  }
  if (k === 'video'){
    if (t === '音频') return videoAudio(c);
    if (t === '变速') return speedPanel(c, '视频');
    return sub === '蒙版' ? maskPanel(c) : videoBase(c, '视频');
  }
  // audio
  return t === '变速' ? speedPanel(c, '音频') : audioBase(c);
}

function setSpeed(c, v){
  c.speed = Math.min(10, Math.max(0.1, v));
  c.len = Math.max(0.3, c.baseDur / c.speed);
  relayoutVideo(); renderTimeline(); renderProps();
}
function setDur(c, d){
  if (!isFinite(d) || d <= 0) return;
  setSpeed(c, c.baseDur / d);
}
function relayoutVideo(){
  let t = 0;
  S.clips.filter(x => x.track === 'video').sort((a, b) => a.start - b.start)
    .forEach(x => { x.start = t; t += x.len; });
  S.total = Math.max(12, t + 0.4);
}

let cvHistory = [];
function cvPushHistory(){
  cvHistory.push(JSON.stringify({nodes:S.canvas.nodes, links:S.canvas.links}));
  if (cvHistory.length > 40) cvHistory.shift();
}
function cvUndo(){
  const d = cvHistory.pop();
  if (!d) return toast('没有可撤销的操作');
  const o = JSON.parse(d);
  S.canvas.nodes = o.nodes; S.canvas.links = o.links;
  S.canvas.sel = []; S.canvas.linkSel = null;
  renderCanvas(); toast('已撤销');
}

const VID_STATE = {};
function captureVideos(){
  $$('.cnode').forEach(cn => {
    const v = cn.querySelector('.cv-video');
    if (!v) return;
    if (v.readyState === 0) return;  // 新元素还没加载完，保留上一次的状态
    VID_STATE[cn.dataset.node] = {t: v.currentTime || 0, playing: !v.paused};
  });
}
function restoreVideos(){
  $$('.cnode').forEach(cn => {
    const v = cn.querySelector('.cv-video'); const st = VID_STATE[cn.dataset.node];
    if (!v || !st) return;
    if (st.t > 0.05){
      const set = () => { try { v.currentTime = st.t; } catch(e){} };
      if (v.readyState >= 1) set(); else v.addEventListener('loadedmetadata', set, {once:true});
    }
    if (st.playing){ v.play().catch(()=>{}); cn.classList.add('playing'); }
  });
}
let lastNodeSig = '';
function nodeSignature(){
  return S.canvas.nodes.map(n => [n.id, n.type, n.w, n.x, n.y, n.src || '', n.status || '', n.badge || '', n.dur || ''].join('~')).join('|');

  $('#cv-world').style.transform = `translate(${c.x}px,${c.y}px) scale(${c.zoom})`;

    </div>${PORTS}${cap(isVideo ? 'video' : 'image', n.title)}
    <div class="cact"><button data-send="${n.id}">送入剪辑箱</button></div>
  </div>`;

function linkPath(A, B, ha, hb){
  const vertical = Math.abs(B.x - A.x) < 90;
  if (vertical){
    const ax = A.x + A.w / 2, ay = A.y + ha, bx = B.x + B.w / 2, by = B.y;
    const dy = Math.max(30, Math.abs(by - ay) * .45);
    return `M${ax},${ay} C${ax},${ay + dy} ${bx},${by - dy} ${bx},${by}`;
  }
  const ax = A.x + A.w, ay = A.y + ha / 2 - 12;
  const bx = B.x, by = B.y + hb / 2 - 12;
  const dx = Math.max(40, Math.abs(bx - ax) * .45);
  return `M${ax},${ay} C${ax + dx},${ay} ${bx - dx},${by} ${bx},${by}`;
}

function drawLinks(){
  const byId = Object.fromEntries(S.canvas.nodes.map(n => [n.id, n]));
  const hOf = id => ($(`[data-node="${id}"]`)?.offsetHeight) || 200;
  let html = '';
  S.canvas.links.forEach(([a, b]) => {
    const A = byId[a], B = byId[b];
    if (!A || !B) return;
    const d = linkPath(A, B, hOf(a), hOf(b));
    const key = a + '|' + b;
    const sel = S.canvas.linkSel === key ? ' sel' : '';
    html += `<path class="lk${sel}" d="${d}"/><path class="lk-hit" data-link="${key}" d="${d}"/>`;
  });
  if (S.canvas.linking && S.canvas.linking.to){
    const A = byId[S.canvas.linking.from];
    if (A){
      const ha = hOf(A.id);
      const ax = A.x + A.w, ay = A.y + ha / 2 - 12;
      const bx = S.canvas.linking.to.x, by = S.canvas.linking.to.y;
      const dx = Math.max(40, Math.abs(bx - ax) * .45);
      html += `<path class="lk-tmp" d="M${ax},${ay} C${ax + dx},${ay} ${bx - dx},${by} ${bx},${by}"/>`;
    }
  }
  $('#cv-links').innerHTML = html;
}
